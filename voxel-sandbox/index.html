<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Sandbox</title>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <!-- Perf overlay -->
    <div id="stats">
      <div><span class="label">FPS</span><span id="fps-value">—</span></div>
      <div><span class="label">BLOCKS</span><span id="draw-value">0</span></div>
      <div><span class="label">POS</span><span id="pos-value">0 0 0</span></div>
    </div>

    <div id="crosshair"></div>

    <div id="lock-overlay">
      <div class="panel">
        <h1>Voxel Sandbox</h1>
        <p class="sub">Phase 1 — movement &amp; world</p>
        <p class="cta">Click to play</p>
        <ul class="controls">
          <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>Move</span></li>
          <li><kbd>Mouse</kbd><span>Look</span></li>
          <li><kbd>Space</kbd><span>Jump</span></li>
          <li><kbd>Shift</kbd><span>Sprint</span></li>
          <li><kbd>Esc</kbd><span>Release cursor</span></li>
        </ul>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
