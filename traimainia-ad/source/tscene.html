const glowWhite=glowTex('rgba(255,255,240,1)','rgba(255,220,150,.5)'),glowRed=glowTex('rgba(255,80,60,1)','rgba(255,30,20,.45)'),glowFire=glowTex('rgba(255,250,210,1)','rgba(255,150,40,.7)');

const BOOMS=KILLS.map((t,k)=>({t,k,R:3.2}));BOOMS.push({t:9.1,raider:0,R:4.5},{t:9.45,raider:3.5,R:3.5},{t:9.8,raider:-3.5,R:3.8});

  const a=r()*Math.PI*2,e=r()*1.2-.2,v=6+r()*10;return{m,v:new THREE.Vector3(Math.cos(a)*Math.cos(e)*v,Math.sin(e)*v+4,Math.sin(a)*Math.cos(e)*v),rot:r()*10}});bm.g=g;g.visible=false});

const gun=new THREE.Group();cam.add(gun);
{box(.09,.11,.62,M.dark,0,0,0,gun);box(.1,.06,.3,M.orange,0,.07,-.05,gun);const br=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.4,8),M.steel);br.rotation.x=Math.PI/2;br.position.set(0,.01,-.48);gun.add(br);

 if(t>=2.05&&t<3.0){const k=seg(t,2.05,2.3);logo(540,900,190,lerp(1.8,1,easeBack(k)),Math.min(1,k*3))}
 if(t<.5){ctx.fillStyle=`rgba(0,0,0,${1-seg(t,0,.5)})`;ctx.fillRect(0,0,W,H)}
 // FPS HUD
 if(t>=3.0&&t<8.0){const kills=KILLS.filter(k=>k<=t).length,shots=SHOTS.filter(s=>s.t<=t).length;
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;const cx=540,cy=960;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ctx.beginPath();ctx.moveTo(cx+dx*14,cy+dy*14);ctx.lineTo(cx+dx*38,cy+dy*38);ctx.stroke()}
  const hit=KILLS.find(k=>t-k>=0&&t-k<.25);if(hit!==undefined){ctx.strokeStyle=COL.orange;ctx.lineWidth=6;for(const [dx,dy] of [[1,1],[-1,1],[1,-1],[-1,-1]]){ctx.beginPath();ctx.moveTo(cx+dx*22,cy+dy*22);ctx.lineTo(cx+dx*50,cy+dy*50);ctx.stroke()}}
  T('SPEED 212 KM/H',70,260,44,COL.ink,{font:'Rajdhani',align:'left',stroke:6});T('CAR 02 / 06',70,310,44,COL.hazard,{font:'Rajdhani',align:'left',stroke:6});
  T(String(30-shots).padStart(2,'0'),1000,1560,120,COL.ink,{align:'right',stroke:10});T('/ 30',1000,1640,46,COL.hazard,{font:'Rajdhani',align:'right',stroke:6});
  KILLS.forEach((tk,i)=>{const d=t-tk;if(d>=0&&d<1.6){const slot=KILLS.filter(k=>k<=t&&t-k<1.6).length-1-KILLS.slice(0,i).filter(k=>k<=t&&t-k<1.6).length;
   T('DRONE DOWN  +100',1010,260+slot*56,44,COL.orange,{font:'Rajdhani',align:'right',stroke:6,alpha:1-seg(d,1.3,1.6)})}});
  T('SCORE '+kills*100,540,200,48,COL.ink,{font:'Rajdhani',stroke:6});
  caption('HOLD THE TRAIN.',3.25,5.6,t);caption('CLEAR EVERY CAR.',5.6,8.0,t);}
 // chase
 if(t>=8.0&&t<11.0){caption('NO BRAKES.',8.15,11,t,1330);if(t>=9.1){const k=seg(t,9.1,9.3);T('NO MERCY.',540,1460,150,COL.hazard,{stroke:14,scale:lerp(1.6,1,easeBack(k)),alpha:Math.min(1,k*3)*(1-seg(t,10.85,11)),glow:true})}}
 // end card
 if(t>=11.0){const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(8,4,10,.55)');gr.addColorStop(.35,'rgba(8,4,10,0)');gr.addColorStop(.6,'rgba(8,4,10,0)');gr.addColorStop(1,'rgba(8,4,10,.8)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  const k=seg(t,11.3,11.55);if(t>=11.3)logo(540,470,200,lerp(2.2,1,easeBack(k)),Math.min(1,k*3));
  if(t>=11.9){T("THE TRAIN DOESN'T STOP.",540,640,64,COL.ink,{stroke:8,alpha:seg(t,11.9,12.2),ls:2})}
  if(t>=12.3){T('NEITHER DO YOU.',540,715,64,COL.hazard,{stroke:8,alpha:seg(t,12.3,12.6),ls:2})}
  if(t>=12.8){const k2=easeBack(seg(t,12.8,13.05));ctx.save();ctx.translate(540,1290);ctx.scale(k2,k2);ctx.fillStyle=COL.hazard;ctx.fillRect(-450,-66,900,132);ctx.restore();
   T('COMING SOON TO STEAM',540,1296,80,'#0b0b0e',{scale:k2,ls:2})}
  if(t>=13.4){const pulse=1+Math.sin((t-13.4)*8)*.03;ctx.save();ctx.globalAlpha=seg(t,13.4,13.6);ctx.translate(540,1440);ctx.scale(pulse,pulse);ctx.strokeStyle=COL.ink;ctx.lineWidth=5;ctx.strokeRect(-280,-52,560,104);ctx.restore();
   T('WISHLIST NOW',540,1446,76,COL.ink,{scale:pulse,alpha:seg(t,13.4,13.6),ls:4})}
  if(t>=13.8)T('PC  ·  3D SHOOTER  ·  1 PLAYER',540,1550,40,'rgba(244,239,230,.8)',{font:'Rajdhani',alpha:seg(t,13.8,14.1),ls:3});}
 // cut flashes
 for(const c of [3.0,8.0,11.0]){const d=t-c;if(d>=0&&d<.15){ctx.fillStyle=`rgba(255,240,220,${.8*(1-d/.15)})`;ctx.fillRect(0,0,W,H)}}
 // vignette
 const vg=ctx.createRadialGradient(540,960,650,540,960,1300);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

// camera shake (screen space) from shots, kills, booms, cuts, slam
const IMP=[...SHOTS.map(s=>({t:s.t,a:6})),...BOOMS.map(b=>({t:b.t,a:b.R*3})),{t:1.35,a:14},{t:11.3,a:26}];
function shake(t){let x=0,y=0;for(const i of IMP){const d=t-i.t;if(d>=0&&d<.5){const e=i.a*Math.exp(-d*10);x+=e*Math.sin(d*90+i.t);y+=e*Math.cos(d*73)}}return[x,y]}

window.render=t=>{update3D(t);renderer.render(scene,cam);const [sx,sy]=shake(t);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 ctx.drawImage(renderer.domElement,sx-12,sy-12,W+24,H+24);overlay(t)};
await document.fonts.load('700 40px Teko');await document.fonts.load('700 40px Rajdhani');
window.READY=true;
</script>
